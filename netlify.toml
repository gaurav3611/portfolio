# Static export of the Next.js site (every route is prerendered).
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  STATIC_EXPORT = "1"
  NODE_VERSION = "22"

# The share image is emitted without an extension; serve it as PNG.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
